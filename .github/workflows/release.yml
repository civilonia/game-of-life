name: Release package

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Validate and publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag and main history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          semver_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $semver_tag_pattern ]]; then
            echo "Release tag must use valid SemVer (vMAJOR.MINOR.PATCH with optional prerelease or build metadata): $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit in main history." >&2
            exit 1
          fi

          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./gradlew publish -PreleaseTag="$RELEASE_TAG"
