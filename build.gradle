plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.civilonia'

def releaseTag = providers.gradleProperty('releaseTag')
    .orElse(providers.environmentVariable('RELEASE_TAG'))
    .orNull

// SemVer 2.0.0 with a required leading "v". Numeric prerelease identifiers
// cannot have leading zeroes; build metadata identifiers may.
def releaseTagPattern = ~/^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$/

def versionForReleaseTag = { tag ->
    def matcher = (tag =~ releaseTagPattern)
    if (!matcher.matches()) {
        throw new GradleException("releaseTag must use a valid SemVer tag (vMAJOR.MINOR.PATCH with optional prerelease or build metadata): ${tag}")
    }
    matcher.group(1)
}

if (releaseTag != null) {
    version = versionForReleaseTag(releaseTag)
} else {
    version = '0.1.0-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

sourceSets {
    example {
        java.srcDir('src/example/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    testImplementation sourceSets.example.output
}

tasks.register('runProgram', JavaExec) {
    group = 'application'
    description = 'Runs the standalone Game of Life program.'
    classpath = sourceSets.example.runtimeClasspath
    mainClass = 'com.civilonia.gameoflife.example.Program'
    dependsOn(tasks.named('exampleClasses'))
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn(tasks.named('jar'))
    doFirst {
        systemProperty('libraryJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath)
    }
}

tasks.register('verifyReleaseTagValidation') {
    group = 'verification'
    description = 'Verifies accepted SemVer release tags and their Maven versions.'

    doLast {
        [
            'v0.1.0'             : '0.1.0',
            'v0.1.0-alpha.1'     : '0.1.0-alpha.1',
            'v0.1.0-beta.1'      : '0.1.0-beta.1',
            'v1.0.0-rc.1'        : '1.0.0-rc.1',
            'v1.2.3+build.7'     : '1.2.3+build.7',
            'v1.2.3-rc.1+build.7': '1.2.3-rc.1+build.7'
        ].each { tag, expectedVersion ->
            assert versionForReleaseTag(tag) == expectedVersion: "Expected ${tag} to resolve to ${expectedVersion}"
        }

        ['0.1.0', 'v0.1', 'v01.0.0', 'v1.0.0-', 'v1.0.0-alpha..1', 'v1.0.0-alpha.01'].each { tag ->
            def accepted = false
            try {
                versionForReleaseTag(tag)
                accepted = true
            } catch (GradleException ignored) {
                // Expected: malformed tags cannot be used for publishing.
            }
            assert !accepted: "Expected invalid release tag to be rejected: ${tag}"
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('verifyReleaseTagValidation'))
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/civilonia/game-of-life')
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').orNull
                password = providers.environmentVariable('GITHUB_TOKEN').orNull
            }
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (releaseTag == null) {
            throw new GradleException('Publishing requires a semantic release tag via -PreleaseTag or RELEASE_TAG.')
        }
    }
}
